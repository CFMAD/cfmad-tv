<body>

<header>

    <div class="header-left">

        <div id="logo">
            <img src="logo.png" alt="CFMAD">
        </div>

        <div class="brand">

            <div id="slogan">

                <span class="blanc">
                    Se former aujourd'hui,
                </span>

                <span class="jaune">
                    réussir demain
                </span>

            </div>

        </div>

    </div>

    <div class="header-right">

        <div id="heure">00:00:00</div>

        <div class="date-wrapper">

            <div id="jour">Lundi</div>

            <div id="date">01/01/2026</div>

        </div>

    </div>

</header>

<main>

    <!-- COLONNE 1 -->

    <section id="planning-section">

        <h2>Planning du jour</h2>

        <div id="planning-header">

            <span>Horaire</span>
            <span>Classe</span>
            <span>Formation</span>
            <span>Salle</span>
            <span>Formateur</span>

        </div>

        <div id="planning">

        </div>

    </section>

    <!-- COLONNE 2 -->

    <section id="photo-section">

        <img
            id="photo-principale"
            src=""
            alt="Photo">

        <div id="photo-overlay">

            <div id="photo-message">

                Bienvenue au CFMAD

            </div>

        </div>

    </section>

    <!-- COLONNE 3 -->

    <div id="right-column">

        <section id="urgent-card">

            <h3>Information importante</h3>

            <div id="urgent">

                Chargement...

            </div>

        </section>

        <section id="citation-card">

            <h3>Citation du jour</h3>

            <div id="citation">

                Chargement...

            </div>

        </section>

        <section id="facebook-card">

            <h3>Facebook</h3>

            <div id="facebook-link">

                <img
                    id="facebook-qr"
                    src="QR.png"
                    alt="QR Facebook">

            </div>

        </section>

    </div>

</main>

<section id="vitrine-section">

    <div id="vitrine">

        <!-- Généré par JS -->

    </div>

</section>

<footer>

    <div id="bandeau">

        Chargement...

    </div>

</footer>

<script src="app.js"></script>

</body>

</html>
