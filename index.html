<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFMAD TV</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HEADER -->

<header>

    <div class="header-left">

        <div id="logo">
<img src="header.jpg" alt="CFMAD">
</div>

        <div class="centre">

            <div class="nom-centre">
                Centre de Formation des Métiers de l'Aide à Domicile
            </div>

            <div id="slogan">
                Chargement...
            </div>

        </div>

    </div>

<div class="header-right">

    <div id="heure">00:00</div>

    <div class="date-wrapper">
        <div id="jour">Lundi</div>
        <div id="date">01 janvier 2025</div>
    </div>

</div>

</header>

<!-- CONTENU PRINCIPAL -->

<main>

    <!-- PLANNING -->

<section id="planning-section">

    <h2>Planning du jour</h2>

    <div id="planning">

        <div id="planning-header">

            <span>Horaire</span>
            <span>Classe</span>
            <span>Formation</span>
            <span>Salle</span>
            <span>Formateur</span>

        </div>

    </div>

</section>

    <!-- PHOTO -->

    <section id="photo-section">

        <div id="photo-container">

            <img id="photo-principale" src="" alt="Photo">

            <div id="photo-overlay">

                <div id="photo-message">
                    Bienvenue au CFMAD
                </div>

            </div>

        </div>

    </section>

    <!-- COLONNE DROITE -->

    <section id="right-column">

        <div id="urgent-card">

            <h3>Information importante</h3>

            <div id="urgent">
                Aucun message
            </div>

        </div>

        <div id="citation-card">

            <h3>Citation du jour</h3>

            <div id="citation">
                Chargement...
            </div>

        </div>

        <div id="facebook-card">

            <h3>Facebook</h3>

            <div id="facebook-link">

            </div>

            <div id="qrcode">

            </div>

        </div>

    </section>

</main>

<!-- VITRINE -->

<section id="vitrine-section">

    <div id="vitrine">

    </div>

</section>

<!-- BANDEAU BAS -->

<footer>

    <div id="bandeau">

    </div>

</footer>

<script src="app.js"></script>

</body>

</html>
