<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-!">

<title>CFMAD</title>
<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>


.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#083847;
}

.logo{
font-size:40px;
font-weight:bold;
}

.content{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:#0F5F76;
border-radius:12px;
padding:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #43D7D0;
}

.urgent{
background:#D89A2B;
color:black;
padding:15px;
font-size:24px;
font-weight:bold;
}

.footer{
position:fixed;
bottom:0;
width:100%;
background:#083847;
padding:12px;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">
CFMAD
</div>

<div id="clock"></div>

</div>

<div id="urgent"></div>

<div class="content">

<div class="card">

<h2>Planning du jour</h2>

<table id="planning"></table>

</div>

<div>

<div class="card">

<h2>Messages</h2>

<div id="messages"></div>

</div>

<br>

<div class="card">

<h2>Citation du jour</h2>

<div id="quote"></div>

</div>

</div>

</div>

<div class="footer" id="ticker"></div>

<script src="app.js"></script>

</body>

</html>
