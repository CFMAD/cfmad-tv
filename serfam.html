<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SERFAM TV</title>

<link rel="stylesheet" href="serfam.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- ===========================
HEADER
=========================== -->

<header>

    <div class="header-left">

        <img src="serfam-logo.png" id="logo" alt="Serfam">

        <div id="accroche">

            Soutenir les familles,<br>
            <span>à chaque étape de la vie</span>

        </div>

    </div>

    <div class="header-right">

        <div id="heure">00:00</div>

        <div class="date-wrapper">

            <div id="jour">Lundi</div>

            <div id="date">01/01/2025</div>

        </div>

    </div>

</header>

<!-- ===========================
CONTENU
=========================== -->

<main>
    
<div id="photo-container">

    <img id="photo-principale" src="" alt="Photo Serfam">

</div>
    
    <!-- PHOTO -->

    <section id="photo-section">

        <img id="photo-principale" src="" alt="Photo Serfam">

        <div id="photo-overlay">

            <div id="photo-message">

                Bienvenue au SERFAM

            </div>

        </div>

    </section>

    <!-- REUNIONS -->

    <section id="reunions-section">

        <h2>Réunions du jour</h2>

        <div id="reunions">

            <!-- généré par JS -->

        </div>

    </section>

</main>

<!-- ===========================
INFOS
=========================== -->

<section id="infos">

    <div id="urgent-card">

        <h3>Information importante</h3>

        <div id="urgent">

            Chargement...

        </div>

    </div>

    <div id="citation-card">

        <h3>Citation du jour</h3>

        <div id="citation">

            Chargement...

        </div>

    </div>

    <div id="facebook-card">

        <h3>Facebook</h3>

        <img src="QR-serfam.png" id="facebook-qr">

    </div>

    <div id="contact-card">

        <h3>Contact</h3>

        <div id="contact">

            📞 02 xxx xx xx<br>
            ✉ info@serfam.be

        </div>

    </div>

</section>

<!-- ===========================
VITRINE
=========================== -->

<section id="vitrine-section">

    <div id="vitrine">

    </div>

</section>

<!-- ===========================
BANDEAU
=========================== -->

<footer>

    <div id="bandeau">

    </div>

</footer>

<script src="serfamapp.js"></script>

</body>

</html>
