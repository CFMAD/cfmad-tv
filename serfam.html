<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SERFAM TV</title>

<link rel="stylesheet" href="serfam.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- ==================================================
     HEADER
================================================== -->

<header>

    <div class="header-left">

        <div id="logo">
            <img src="serfam-logo.png" alt="SERFAM">
        </div>

        <div class="brand">

         <div id="slogan">

             <span class="blanc">
            Service familial de Charleroi
             </span>

             <span class="jaune">
            service d'aide aux familles et aux aînés.
             </span>

         </div>

     </div>

    </div>


    <div class="header-right">

        <div id="heure">00:00:00</div>

        <div class="date-wrapper">

            <div id="jour">Lundi</div>

            <div id="date">01/01/2026</div>

        </div>

    </div>

</header>


<!-- ==================================================
     CONTENU PRINCIPAL
================================================== -->

<main>


    <!-- ==========================
         COLONNE 1 : PLANNING
    =========================== -->

    <section id="planning-section">

        <h2>Planning du jour</h2>

        <div id="planning-header">

            <span>Horaire</span>
            <span>Formation</span>
            <span>Salle</span>
            <span>Formateur</span>

        </div>

        <div id="planning">

            <!-- Généré par JavaScript -->

        </div>

    </section>


    <!-- ==========================
         COLONNE 2 : PHOTO
    =========================== -->

    <section id="photo-section">

        <img
            id="photo-principale"
            src=""
            alt="SERFAM">

        <div id="photo-overlay">

            <div id="photo-message">
                Bienvenue au SERFAM
            </div>

        </div>

    </section>


    <!-- ==========================
         COLONNE 3 : INFORMATIONS
    =========================== -->

    <div id="right-column">


        <!-- INFORMATION IMPORTANTE -->

        <section id="urgent-card">

            <h3>Information importante</h3>

            <div id="urgent">

                Chargement...

            </div>

        </section>


        <!-- CITATION -->

        <section id="citation-card">

            <h3>Citation du jour</h3>

            <div id="citation">

                Chargement...

            </div>

        </section>


        <!-- FACEBOOK -->

        <section id="facebook-card">

            <h3>Facebook</h3>

            <div id="facebook-link">

                <img
                    id="facebook-qr"
                    src="QR-serfam.png"
                    alt="QR Facebook">

            </div>

        </section>


    </div>

</main>


<!-- ==================================================
     VITRINE
================================================== -->

<section id="vitrine-section">

    <div id="vitrine">

        <!-- Généré par JavaScript -->

    </div>

</section>


<!-- ==================================================
     FOOTER
================================================== -->

<footer>

    <div id="bandeau">

        Chargement...

    </div>

</footer>


<script src="serfamapp.js"></script>

</body>

</html>
